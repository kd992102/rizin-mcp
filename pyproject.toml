[project]
name = "rizin-mcp"
version = "0.1.0"
description = "Model Context Protocol (MCP) Server for Rizin binary disassembler & Ghidra decompiler with Mandiant capa integration."
readme = "README.md"
authors = [
    { name = "Rizin MCP Maintainers" }
]
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "flare-capa>=9.4.0",
    "mcp[cli]>=2.0.0",
    "openai>=2.54.0",
    "pefile>=2023.2.7",
    "rzpipe>=0.6.2",
]

[project.scripts]
rizin-mcp = "rizin_mcp.server:main"
# rizin-mcp-proxy was removed: client_proxy.py moved to examples/ (it's a manual dev-time
# tool-calling test script with a hardcoded API base_url/system prompt, not a public feature of
# this package) - run it directly with `uv run python examples/client_proxy.py` instead.

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = true
