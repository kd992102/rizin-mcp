services:
  rizin-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rizin-mcp-server
    restart: unless-stopped
    stdin_open: true # Keep Stdio MCP communication channel open
    tty: true
    security_opt:
      - no-new-privileges:true
    read_only: false
    volumes:
      # Use isolated Docker Named Volume (does not share with local .analysis_cache)
      - docker_analysis_cache:/app/.analysis_cache
      # Mount local samples analysis directory
      - ../samples:/samples
      # Mount capa-rules repository (facilitates dynamic rule updates)
      - ../capa-rules:/app/capa-rules
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

volumes:
  docker_analysis_cache:
