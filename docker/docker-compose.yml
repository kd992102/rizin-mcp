version: '3.8'

services:
  rizin-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rizin-mcp-server
    restart: unless-stopped
    stdin_open: true # 保持 Stdio MCP 通訊管道開啟
    tty: true
    security_opt:
      - no-new-privileges:true
    read_only: false
    volumes:
      # 掛載持久化分析快取
      - ../.analysis_cache:/app/.analysis_cache
      # 掛載本地樣本分析目錄
      - ../samples:/samples
      # 掛載 capa 規則庫 (便於動態更新規則)
      - ../capa-rules:/app/capa-rules
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
