services:
  rizin-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: rizin-mcp-server
    restart: unless-stopped
    stdin_open: true # 保持 Stdio MCP 通訊管道開啟
    tty: true
    security_opt:
      - no-new-privileges:true
    read_only: false
    volumes:
      # 使用 Docker 獨立 Named Volume (不與本機 .analysis_cache 共用)
      - docker_analysis_cache:/app/.analysis_cache
      # 掛載本地樣本分析目錄
      - ../samples:/samples
      # 掛載 capa 規則庫 (便於動態更新規則)
      - ../capa-rules:/app/capa-rules
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

volumes:
  docker_analysis_cache:
